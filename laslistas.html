<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas ordenadas y desordenadas</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            padding: 28px;
        }

        .container {
            width: min(860px, 100%);
            background: rgba(15, 23, 42, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 26px;
            padding: 32px;
            box-shadow: 0 28px 60px rgba(0, 0, 0, 0.25);
        }

        h1, h2 {
            margin: 0;
        }

        h1 {
            font-size: clamp(2rem, 4vw, 2.6rem);
            margin-bottom: 10px;
        }

        p.description {
            color: #94a3b8;
            margin: 0 0 24px;
            line-height: 1.8;
        }

        .list-box {
            display: grid;
            gap: 24px;
        }

        .list-box section {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 22px;
        }

        ul, ol {
            margin: 12px 0 0 0;
            padding-left: 24px;
            color: #e2e8f0;
        }

        li {
            margin: 10px 0;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
        }

        .author {
            margin-top: 26px;
            color: #94a3b8;
            text-align: right;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ejemplo de listas</h1>
        <p class="description">Aquí verás una lista desordenada y una ordenada con un diseño más moderno y fácil de leer.</p>

        <div class="list-box">
            <section>
                <h2>Lista desordenada</h2>
                <ul>
                    <li>Item uno</li>
                    <li>Item dos</li>
                    <li>Item tres</li>
                </ul>
            </section>

            <section>
                <h2>Lista ordenada</h2>
                <ol>
                    <li>Primer elemento</li>
                    <li>Segundo elemento</li>
                    <li>Tercer elemento</li>
                </ol>
            </section>
        </div>

        <p class="author">Autor: Alejandro Rodriguez</p>
    </div>
</body>
</html>
